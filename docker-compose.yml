services:
  api:
    build:
      context: ./src/TicketAssistant.Api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # LLM backend: Ollama (default, local) | Anthropic | OpenAI | Google. Only the
      # selected provider's API key is needed; Ollama needs none.
      Llm__Provider: ${LLM_PROVIDER:-Ollama}
      Ollama__BaseUrl: http://ollama:11434
      # Shared with ollama-pull below: first entry = the assistant's default model, the
      # rest are downloaded too so the console's dropdown has choices.
      Ollama__Models: ${OLLAMA_MODELS:-qwen2.5:3b qwen2.5:1.5b}
      # Mirror of the GPU device handed to the ollama service below, so the status badge
      # can tell "no GPU attached" apart from "GPU attached but idle/forced-CPU".
      Ollama__GpuDevice: ${OLLAMA_GPU_DEVICE:-}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Google__ApiKey: ${GOOGLE_API_KEY:-}
      # Which ticket backends the assistant drives — space/comma separated, used together. Any of
      # Http (the ticketing-mock service below), Jira (real Jira Cloud via per-user OAuth login —
      # fill in the ATLASSIAN_* vars in .env), InMemory (offline stub). e.g. "Http Jira" for both.
      Tickets__Backends: ${TICKETS_BACKENDS:-Http}
      Tickets__Http__BaseUrl: http://ticketing-mock:8080
      Tickets__Jira__ProjectKey: ${TICKETS_JIRA_PROJECT_KEY:-}
      Tickets__Jira__IssueType: ${TICKETS_JIRA_ISSUE_TYPE:-Task}
      Tickets__Jira__ScopeToReporter: ${TICKETS_JIRA_SCOPE_TO_REPORTER:-true}
      # Atlassian OAuth 2.0 (3LO) app — only read when Tickets__Backend=Jira. The redirect and
      # frontend origin default to this compose's host ports.
      Atlassian__ClientId: ${ATLASSIAN_CLIENT_ID:-}
      Atlassian__ClientSecret: ${ATLASSIAN_CLIENT_SECRET:-}
      Atlassian__RedirectUri: ${ATLASSIAN_REDIRECT_URI:-http://localhost:5080/api/auth/jira/callback}
      Atlassian__FrontendOrigin: ${ATLASSIAN_FRONTEND_ORIGIN:-http://localhost:4200}
    depends_on:
      - ollama
      - ticketing-mock

  # The Angular console (dev server). Talks to the API at http://localhost:5080 from the browser
  # (CORS on the API allows :4200). Source is bind-mounted for live editing; node_modules comes
  # from the image so a fresh clone needs no host Node.
  web:
    build:
      context: ./src/web
    ports:
      - "4200:4200"
    volumes:
      - ./src/web:/app
      - /app/node_modules
    # SELinux hosts (Fedora/RHEL) block bind-mount access unless labeling is disabled for the
    # container (same as the ollama service). Harmless elsewhere.
    security_opt:
      - label=disable
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # Keep models loaded instead of unloading after ~5 idle minutes — reloading takes
      # upwards of a minute, which would otherwise hit the first message after any pause.
      # Override with e.g. "10m" if the (V)RAM should be freed when idle.
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    # GPU toggle. Compose can't conditionally attach a device, so the device to expose
    # comes from .env: leave OLLAMA_GPU_DEVICE unset for CPU (the default maps the
    # harmless /dev/null), or set it to nvidia.com/gpu=all to hand the container the
    # host's NVIDIA GPU (one-time host setup required — see README "GPU acceleration").
    # Ollama picks automatically: GPU when it sees one, CPU otherwise.
    devices:
      - ${OLLAMA_GPU_DEVICE:-/dev/null}
    # On SELinux hosts (Fedora/RHEL) container labeling blocks access to the GPU devices
    # ("Failed to initialize NVML: Insufficient Permissions") — disable labeling for this
    # one container. Harmless on hosts without SELinux.
    security_opt:
      - label=disable

  # One-shot helper: pulls the chat models into the ollama service on startup, so a fresh
  # clone works without a manual `ollama pull`. Pulls the default model plus any extras
  # (space-separated) so the console's model dropdown has real choices. Idempotent — models
  # already present are just verified. Watch first-run download progress with:
  #   podman compose logs -f ollama-pull
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      # The ollama CLI talks to the server container instead of starting its own.
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_PULL_MODELS: ${OLLAMA_MODELS:-qwen2.5:3b qwen2.5:1.5b}
    restart: "no"
    # $$ so variables are resolved by the shell at runtime, not by compose. Each pull is
    # retried on failure (ollama resumes partial downloads, so retries are cheap) — a
    # network blip shouldn't leave a fresh install without its models.
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done;
      for m in $$OLLAMA_PULL_MODELS; do
        echo \"--- pulling $$m ---\";
        n=0; until ollama pull \"$$m\"; do
          n=$$((n+1));
          if [ $$n -ge 10 ]; then echo \"Giving up on $$m after 10 attempts.\"; exit 1; fi;
          echo \"Pull of $$m failed (attempt $$n/10) - retrying in 10s...\"; sleep 10;
        done;
      done;
      first=$${OLLAMA_PULL_MODELS%% *};
      echo \"--- loading and warming up $$first (takes a minute; messages are then instant) ---\";
      ollama run \"$$first\" hi </dev/null >/dev/null 2>&1 || true;
      echo \"--- $$first ready ---\""]

  # Stands in for a real external ticketing system (Jira/Zendesk/...) so created tickets
  # can be seen landing in a separate app. Board UI at http://localhost:5090/
  ticketing-mock:
    build:
      context: ./src/TicketingMock.Api
    ports:
      - "5090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PublicBaseUrl: http://localhost:5090

volumes:
  ollama-data:
