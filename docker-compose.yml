services:
  api:
    build:
      context: ./src/TicketAssistant.Api
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # LLM backend: Ollama (default, local) | Anthropic | OpenAI | Google. Only the
      # selected provider's API key is needed; Ollama needs none.
      Llm__Provider: ${LLM_PROVIDER:-Ollama}
      Ollama__BaseUrl: http://ollama:11434
      Ollama__Model: ${OLLAMA_MODEL:-llama3.2:3b}
      Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      Google__ApiKey: ${GOOGLE_API_KEY:-}
      # Where the assistant sends ticket operations (the ticketing-mock service below).
      Tickets__Backend: Http
      Tickets__Http__BaseUrl: http://ticketing-mock:8080
    depends_on:
      - ollama
      - ticketing-mock

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # GPU toggle. Compose can't conditionally attach a device, so the device to expose
    # comes from .env: leave OLLAMA_GPU_DEVICE unset for CPU (the default maps the
    # harmless /dev/null), or set it to nvidia.com/gpu=all to hand the container the
    # host's NVIDIA GPU (one-time host setup required — see README "GPU acceleration").
    # Ollama picks automatically: GPU when it sees one, CPU otherwise.
    devices:
      - ${OLLAMA_GPU_DEVICE:-/dev/null}

  # Stands in for a real external ticketing system (Jira/Zendesk/...) so created tickets
  # can be seen landing in a separate app. Board UI at http://localhost:5090/
  ticketing-mock:
    build:
      context: ./src/TicketingMock.Api
    ports:
      - "5090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      PublicBaseUrl: http://localhost:5090

volumes:
  ollama-data:
