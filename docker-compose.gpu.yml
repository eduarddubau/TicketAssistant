# Optional override: run Ollama on the host's NVIDIA GPU instead of the CPU.
#
# Opt in by adding this file as a second -f flag (order matters — overrides come last):
#
#   podman compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Without the flag nothing changes — the base compose file keeps Ollama on the CPU.
#
# One-time host prerequisites (see README "GPU acceleration" for details):
#   1. A working NVIDIA driver on the host (`nvidia-smi` must print your GPU).
#   2. The NVIDIA container toolkit (`nvidia-container-toolkit` package).
#   3. A generated CDI spec so podman can see the GPU:
#        sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml
#
# Note on models: the GPU needs enough VRAM to hold the model. llama3.2:3b (~2 GB) fits
# comfortably in 6 GB; qwen3:8b (~5 GB) is a tight fit. If a model doesn't fit, Ollama
# automatically splits it between GPU and CPU — slower, but it still works.
services:
  ollama:
    # CDI device name provided by the generated /etc/cdi/nvidia.yaml. "all" exposes every
    # NVIDIA GPU on the host; use e.g. nvidia.com/gpu=0 to pin a specific card.
    devices:
      - nvidia.com/gpu=all
