<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicketAssistant — test console</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
      background: Canvas; color: CanvasText;
    }
    header {
      padding: .6rem 1rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    header .cid { font: 12px/1 ui-monospace, monospace; opacity: .6; }
    header button {
      margin-left: auto; padding: .35rem .7rem; border-radius: 6px; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit;
    }
    #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
    .msg { max-width: 70ch; padding: .55rem .8rem; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    .assistant a { color: #2563eb; font-weight: 600; }
    .assistant code {
      font-family: ui-monospace, monospace; font-size: .85em; padding: .05rem .3rem;
      border-radius: 4px; background: color-mix(in srgb, CanvasText 10%, transparent);
    }
    .tool { align-self: center; font-size: 12px; opacity: .7; font-family: ui-monospace, monospace; }
    .err { align-self: center; color: #dc2626; font-size: 13px; }
    .thinking { align-self: flex-start; font-size: 13px; opacity: .7; display: flex; align-items: center; gap: .5rem; }
    .thinking .spinner {
      width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor;
      border-right-color: transparent; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card {
      align-self: flex-start; max-width: 60ch; border: 1px solid #f59e0b;
      border-radius: 10px; padding: .8rem; background: color-mix(in srgb, #f59e0b 10%, Canvas);
    }
    .card h3 { margin: 0 0 .6rem; font-size: .9rem; }
    .card pre { margin: 0 0 .6rem; font-size: 12px; overflow-x: auto; }
    .card .fld { display: flex; flex-direction: column; gap: .2rem; font-size: 12px; font-weight: 600; opacity: .85; margin-bottom: .55rem; }
    .card .fld input, .card .fld textarea, .card .fld select {
      font: inherit; font-weight: 400; padding: .4rem .55rem; border-radius: 6px;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit;
    }
    .card .fld textarea { resize: vertical; }
    .card .actions { display: flex; gap: .5rem; margin-top: .2rem; }
    .card button { padding: .35rem .8rem; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
    .card button:disabled { opacity: .5; cursor: default; }
    .approve { background: #16a34a; color: #fff; }
    .decline { background: color-mix(in srgb, CanvasText 15%, Canvas); color: inherit; }
    form { display: flex; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    #input { flex: 1; padding: .6rem .8rem; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit; font: inherit; }
    #send { padding: .6rem 1.1rem; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
    .user-box { display: flex; align-items: center; gap: .35rem; font-size: .8rem; opacity: .85; }
    #provider, #model { padding: .3rem .5rem; border-radius: 6px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit; font: inherit; font-size: .8rem; }
    #model { width: 9rem; }
    #user { width: 8rem; padding: .3rem .5rem; border-radius: 6px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit; font: inherit; font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>TicketAssistant</h1>
    <span class="cid" id="cid">no conversation</span>
    <label class="user-box">👤 user <input id="user" title="You only see tickets created by this user. Change it to test isolation." /></label>
    <label class="user-box">🧠 <select id="provider" title="Which LLM answers. Switching lets you compare how reliably each one calls tools."></select></label>
    <label class="user-box"><input id="model" title="Model id for the selected provider." /></label>
    <button id="reset" type="button">New conversation</button>
  </header>

  <div id="log"></div>

  <form id="form">
    <input id="input" placeholder="Ask about tickets…  (e.g. &quot;create a ticket for the broken login page&quot;)" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const cidLabel = document.getElementById('cid');
    const userInput = document.getElementById('user');
    const providerSelect = document.getElementById('provider');
    const modelInput = document.getElementById('model');
    let conversationId = null;
    let TICKET_BOARD = 'http://localhost:5090';   // replaced by the server's value on connect

    // Identifies the current user; the API scopes tickets to whoever this is. Persisted so
    // a reload keeps the same identity; editable so you can switch users to test isolation.
    let userId = localStorage.getItem('ta-user') || 'alice';
    userInput.value = userId;

    // Chosen LLM. Sent per request, so switching takes effect on the next message without a
    // restart; blank means "whatever the server is configured to use".
    let llmProvider = localStorage.getItem('ta-provider') || '';
    let llmModel = localStorage.getItem('ta-model') || '';
    let defaultModels = {};

    // fetch wrapper that tags every request with the current user and chosen model.
    function api(url, options = {}) {
      const headers = { ...(options.headers || {}), 'X-User-Id': userId };
      if (llmProvider) headers['X-Llm-Provider'] = llmProvider;
      if (llmModel) headers['X-Llm-Model'] = llmModel;
      return fetch(url, { ...options, headers });
    }

    // Populate the switcher from the server's list, defaulting to whatever it currently uses.
    async function loadProviders() {
      try {
        const info = await (await api('/api/llm')).json();
        defaultModels = info.defaultModels || {};
        providerSelect.innerHTML = '';
        for (const p of info.providers) {
          const opt = document.createElement('option');
          opt.value = p; opt.textContent = p;
          providerSelect.append(opt);
        }
        llmProvider = llmProvider || info.provider;
        llmModel = llmModel || info.model;
        providerSelect.value = llmProvider;
        modelInput.value = llmModel;
      } catch { /* switcher is optional — the server default still applies */ }
    }

    // Switching provider swaps in that provider's default model unless one was typed.
    providerSelect.addEventListener('change', () => {
      llmProvider = providerSelect.value;
      llmModel = defaultModels[llmProvider] || '';
      modelInput.value = llmModel;
      localStorage.setItem('ta-provider', llmProvider);
      localStorage.setItem('ta-model', llmModel);
      add('tool', 'now using ' + llmProvider + (llmModel ? ' · ' + llmModel : ''));
    });

    modelInput.addEventListener('change', () => {
      llmModel = modelInput.value.trim();
      localStorage.setItem('ta-model', llmModel);
      add('tool', 'now using ' + llmProvider + (llmModel ? ' · ' + llmModel : ''));
    });

    function add(cls, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      if (cls === 'assistant') renderRich(el);
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    // Models write Markdown; render the small subset they actually use. The raw text is
    // HTML-escaped FIRST, then safe tags are introduced, so model output can't inject markup.
    function mdToHtml(text) {
      let h = (text ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
      h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');          // `inline code`
      h = h.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>'); // **bold**
      h = h.replace(/^#{1,4}\s+(.+)$/gm, '<strong>$1</strong>');  // # headings -> bold lines
      h = h.replace(/^(\s*)[*-]\s+/gm, '$1\u2022 ');             // "* item" / "- item" -> "• item"
      return h;
    }

    // Converts a bubble's accumulated plain text into rendered markdown + ticket links.
    // Called once per message, after it's complete (streaming appends plain text until then).
    function renderRich(el) {
      el.innerHTML = mdToHtml(el.textContent);
      linkifyTickets(el);
    }

    // Turns ticket ids like PROJ-1001 into links to that ticket on the board. Walks text
    // nodes only (never markup), so model output can't inject HTML.
    const TICKET_ID = /\b([A-Z]{2,}-\d+)\b/g;

    function linkifyTickets(el) {
      const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
      const nodes = [];
      while (walker.nextNode()) nodes.push(walker.currentNode);
      for (const node of nodes) {
        if (!TICKET_ID.test(node.textContent)) continue;
        TICKET_ID.lastIndex = 0;
        const frag = document.createDocumentFragment();
        let last = 0, m;
        while ((m = TICKET_ID.exec(node.textContent)) !== null) {
          frag.append(node.textContent.slice(last, m.index));
          const a = document.createElement('a');
          a.href = TICKET_BOARD + '/#' + m[1];
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = m[1];
          frag.append(a);
          last = m.index + m[1].length;
        }
        frag.append(node.textContent.slice(last));
        node.replaceWith(frag);
      }
    }

    async function newConversation() {
      const res = await api('/api/conversations', { method: 'POST' });
      const data = await res.json();
      conversationId = data.conversationId;
      cidLabel.textContent = conversationId;
      log.innerHTML = '';
      add('tool', 'conversation ' + conversationId + ' · user: ' + userId);
      // The server supplies the opening message, so every frontend greets identically.
      if (data.boardUrl) TICKET_BOARD = data.boardUrl;
      if (data.greeting) add('assistant', data.greeting);
    }

    // Reads an SSE (text/event-stream) response body and dispatches each JSON event.
    async function consume(res) {
      streamingBubble = null;   // each request starts a fresh message
      if (!res.ok) { add('err', 'HTTP ' + res.status + ' ' + res.statusText); return; }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split('\n\n');
        buffer = chunks.pop();               // keep the trailing partial frame
        for (const chunk of chunks) {
          const line = chunk.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          stopThinking();   // something arrived — the wait is over
          handleEvent(JSON.parse(line.slice(5).trim()));
        }
      }
      // Stream finished; render a message still open at the end.
      if (streamingBubble) { renderRich(streamingBubble); streamingBubble = null; }
    }

    // The bubble currently being streamed into, so consecutive deltas append to one message.
    let streamingBubble = null;

    function handleEvent(evt) {
      if (evt.type === 'assistant_delta') {
        if (!streamingBubble) streamingBubble = add('assistant', '');
        streamingBubble.textContent += evt.text;
        log.scrollTop = log.scrollHeight;
        return;
      }

      // Anything else ends the message that was streaming — render it now it's complete.
      if (streamingBubble) { renderRich(streamingBubble); streamingBubble = null; }

      if (evt.type === 'assistant_text') add('assistant', evt.text);
      else if (evt.type === 'tool_executed') add('tool', '🔧 ' + evt.toolName + (evt.succeeded ? ' ✓' : ' ✗'));
      else if (evt.type === 'confirmation_required') renderConfirmation(evt);
    }

    const SEVERITIES = ['Low', 'Medium', 'High', 'Urgent'];
    const STATUSES = ['Open', 'InProgress', 'Blocked', 'Resolved', 'Closed'];

    // Builds a labelled field element; returns { row, el, value(), required }.
    function field(label, kind, opts = {}) {
      const row = document.createElement('label');
      row.className = 'fld';
      row.append(label);
      let el;
      if (kind === 'select') {
        el = document.createElement('select');
        for (const o of opts.options) { const op = document.createElement('option'); op.textContent = o; el.append(op); }
        el.value = opts.options.includes(opts.value) ? opts.value : opts.options[0];
      } else {
        el = document.createElement(kind === 'textarea' ? 'textarea' : 'input');
        if (kind === 'textarea') el.rows = 3; else el.type = (kind === 'date' ? 'date' : 'text');
        el.value = opts.value || '';
        if (opts.readonly) el.disabled = true;
      }
      row.append(el);
      return { row, el, value: () => (el.value || '').trim(), required: !!opts.required };
    }

    // Per-tool confirmation dialogs. Each returns { heading, verb, fields (in display order),
    // edits() -> object of edited args to send }.
    function confirmationSpec(evt) {
      const a = evt.arguments || {};
      if (evt.toolName === 'create_ticket') {
        const title = field('Title', 'text', { value: a.title, required: true });
        const desc = field('Description', 'textarea', { value: a.description, required: true });
        const sev = field('Severity', 'select', { options: SEVERITIES, value: a.priority || 'Medium' });
        return {
          heading: '⚠️ Review & confirm new ticket', verb: 'Create ticket',
          fields: [title, desc, sev],
          edits: () => ({ title: title.value(), description: desc.value(), priority: sev.el.value })
        };
      }
      if (evt.toolName === 'update_ticket_status') {
        const tid = field('Ticket', 'text', { value: a.ticketId, readonly: true });
        const status = field('New status', 'select', { options: STATUSES, value: a.status });
        return {
          heading: '⚠️ Confirm status change', verb: 'Update status',
          fields: [tid, status],
          edits: () => ({ status: status.el.value })
        };
      }
      if (evt.toolName === 'set_due_date') {
        const tid = field('Ticket', 'text', { value: a.ticketId, readonly: true });
        // Trim an ISO timestamp down to the date part for the date picker.
        const due = field('Due date (blank = none)', 'date', { value: (a.dueAt || '').slice(0, 10) });
        return {
          heading: '⚠️ Confirm due date', verb: 'Set due date',
          fields: [tid, due],
          edits: () => ({ dueAt: due.value() || null })
        };
      }
      if (evt.toolName === 'assign_ticket') {
        const tid = field('Ticket', 'text', { value: a.ticketId, readonly: true });
        const who = field('Assign to (blank = unassigned)', 'text', { value: a.assignee });
        return {
          heading: '⚠️ Confirm assignment', verb: 'Assign ticket',
          fields: [tid, who],
          edits: () => ({ assignee: who.value() })
        };
      }
      if (evt.toolName === 'resolve_ticket') {
        const tid = field('Ticket', 'text', { value: a.ticketId, readonly: true });
        const note = field('Resolution note', 'textarea', { value: a.note, required: true });
        return {
          heading: '⚠️ Confirm resolve', verb: 'Resolve ticket',
          fields: [tid, note],
          edits: () => ({ note: note.value() })
        };
      }
      if (evt.toolName === 'add_comment') {
        const tid = field('Ticket', 'text', { value: a.ticketId, readonly: true });
        const body = field('Comment', 'textarea', { value: a.body, required: true });
        return {
          heading: '⚠️ Confirm comment', verb: 'Add comment',
          fields: [tid, body],
          edits: () => ({ body: body.value() })
        };
      }
      // Fallback for any other confirmation-required tool: show args read-only.
      const pre = { row: document.createElement('pre'), value: () => '', required: false };
      pre.row.textContent = JSON.stringify(a, null, 2);
      return { heading: '⚠️ Confirm: ' + evt.toolName, verb: 'Confirm', fields: [pre], edits: () => ({}) };
    }

    function renderConfirmation(evt) {
      const spec = confirmationSpec(evt);
      const card = document.createElement('div');
      card.className = 'card';

      const h3 = document.createElement('h3');
      h3.textContent = spec.heading;
      const actions = document.createElement('div');
      actions.className = 'actions';
      const approveBtn = document.createElement('button');
      approveBtn.className = 'approve';
      approveBtn.textContent = spec.verb;
      const declineBtn = document.createElement('button');
      declineBtn.className = 'decline';
      declineBtn.textContent = 'Cancel';
      actions.append(approveBtn, declineBtn);

      card.append(h3);
      for (const f of spec.fields) card.append(f.row);
      card.append(actions);

      const validate = () => {
        approveBtn.disabled = spec.fields.some(f => f.required && !f.value());
      };
      for (const f of spec.fields) if (f.el) f.el.addEventListener('input', validate);
      validate();

      const decide = async (approved) => {
        card.querySelectorAll('input, textarea, select, button').forEach(el => el.disabled = true);
        actions.remove();
        const payload = approved
          ? { callId: evt.callId, approved: true, edits: spec.edits() }
          : { callId: evt.callId, approved: false };
        add('tool', (approved ? 'approved ' : 'declined ') + evt.toolName);
        lock(true);
        startThinking();
        try {
          const res = await api('/api/conversations/' + conversationId + '/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          await consume(res);
        } catch (e) { add('err', String(e)); }
        stopThinking();
        lock(false);
      };
      approveBtn.onclick = () => decide(true);
      declineBtn.onclick = () => decide(false);
      log.appendChild(card);
      log.scrollTop = log.scrollHeight;
    }

    function lock(busy) { send.disabled = busy; input.disabled = busy; if (!busy) input.focus(); }

    // A local model can take 10-25s to reply. Show a spinner with a running clock so the wait
    // reads as "working" rather than "broken"; it clears as soon as anything comes back.
    let thinkingEl = null, thinkingTimer = null;

    function startThinking() {
      stopThinking();
      const started = Date.now();
      thinkingEl = document.createElement('div');
      thinkingEl.className = 'thinking';
      thinkingEl.innerHTML = '<span class="spinner"></span><span class="elapsed">thinking… 0.0s</span>';
      log.appendChild(thinkingEl);
      log.scrollTop = log.scrollHeight;
      thinkingTimer = setInterval(() => {
        const secs = ((Date.now() - started) / 1000).toFixed(1);
        thinkingEl.querySelector('.elapsed').textContent = `thinking… ${secs}s`;
      }, 100);
    }

    function stopThinking() {
      if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
      if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      if (!conversationId) await newConversation();
      add('user', text);
      input.value = '';
      lock(true);
      startThinking();
      try {
        const res = await api('/api/conversations/' + conversationId + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        await consume(res);
      } catch (e) { add('err', String(e)); }
      lock(false);
    });

    function switchUser() {
      const next = userInput.value.trim() || 'alice';
      userInput.value = next;
      if (next === userId) return;
      userId = next;
      localStorage.setItem('ta-user', userId);
      newConversation();   // new context so history doesn't leak across users
    }
    userInput.addEventListener('change', switchUser);

    document.getElementById('reset').onclick = newConversation;
    loadProviders().then(newConversation);
  </script>
</body>
</html>
