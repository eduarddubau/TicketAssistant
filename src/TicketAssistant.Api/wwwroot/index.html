<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicketAssistant — test console</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 15px/1.5 system-ui, sans-serif;
      display: flex; flex-direction: column; height: 100vh;
      background: Canvas; color: CanvasText;
    }
    header {
      padding: .6rem 1rem; border-bottom: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
      display: flex; align-items: center; gap: .75rem; flex-wrap: wrap;
    }
    header h1 { font-size: 1rem; margin: 0; font-weight: 600; }
    header .cid { font: 12px/1 ui-monospace, monospace; opacity: .6; }
    header button {
      margin-left: auto; padding: .35rem .7rem; border-radius: 6px; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: transparent; color: inherit;
    }
    #log { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .6rem; }
    .msg { max-width: 70ch; padding: .55rem .8rem; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; }
    .assistant { align-self: flex-start; background: color-mix(in srgb, CanvasText 8%, Canvas); }
    .tool { align-self: center; font-size: 12px; opacity: .7; font-family: ui-monospace, monospace; }
    .err { align-self: center; color: #dc2626; font-size: 13px; }
    .card {
      align-self: flex-start; max-width: 60ch; border: 1px solid #f59e0b;
      border-radius: 10px; padding: .8rem; background: color-mix(in srgb, #f59e0b 10%, Canvas);
    }
    .card h3 { margin: 0 0 .5rem; font-size: .9rem; }
    .card pre { margin: 0 0 .6rem; font-size: 12px; overflow-x: auto; }
    .card .actions { display: flex; gap: .5rem; }
    .card button { padding: .35rem .8rem; border-radius: 6px; cursor: pointer; border: none; font-weight: 600; }
    .approve { background: #16a34a; color: #fff; }
    .decline { background: color-mix(in srgb, CanvasText 15%, Canvas); color: inherit; }
    form { display: flex; gap: .5rem; padding: .75rem 1rem; border-top: 1px solid color-mix(in srgb, CanvasText 15%, transparent); }
    #input { flex: 1; padding: .6rem .8rem; border-radius: 8px; border: 1px solid color-mix(in srgb, CanvasText 25%, transparent); background: Canvas; color: inherit; font: inherit; }
    #send { padding: .6rem 1.1rem; border-radius: 8px; border: none; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; }
    #send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
  <header>
    <h1>TicketAssistant</h1>
    <span class="cid" id="cid">no conversation</span>
    <button id="reset" type="button">New conversation</button>
  </header>

  <div id="log"></div>

  <form id="form">
    <input id="input" placeholder="Ask about tickets…  (e.g. &quot;create a ticket for the broken login page&quot;)" autocomplete="off" />
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    const cidLabel = document.getElementById('cid');
    let conversationId = null;

    function add(cls, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + cls;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    async function newConversation() {
      const res = await fetch('/api/conversations', { method: 'POST' });
      const data = await res.json();
      conversationId = data.conversationId;
      cidLabel.textContent = conversationId;
      log.innerHTML = '';
      add('tool', 'conversation ' + conversationId);
    }

    // Reads an SSE (text/event-stream) response body and dispatches each JSON event.
    async function consume(res) {
      if (!res.ok) { add('err', 'HTTP ' + res.status + ' ' + res.statusText); return; }
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const chunks = buffer.split('\n\n');
        buffer = chunks.pop();               // keep the trailing partial frame
        for (const chunk of chunks) {
          const line = chunk.split('\n').find(l => l.startsWith('data:'));
          if (!line) continue;
          handleEvent(JSON.parse(line.slice(5).trim()));
        }
      }
    }

    function handleEvent(evt) {
      if (evt.type === 'assistant_text') add('assistant', evt.text);
      else if (evt.type === 'tool_executed') add('tool', '🔧 ' + evt.toolName + (evt.succeeded ? ' ✓' : ' ✗'));
      else if (evt.type === 'confirmation_required') renderConfirmation(evt);
    }

    function renderConfirmation(evt) {
      const card = document.createElement('div');
      card.className = 'card';
      const args = JSON.stringify(evt.arguments, null, 2);
      card.innerHTML = '<h3>⚠️ Confirm: ' + evt.toolName + '</h3><pre></pre>' +
        '<div class="actions"><button class="approve">Create ticket</button>' +
        '<button class="decline">Cancel</button></div>';
      card.querySelector('pre').textContent = args;
      const decide = async (approved) => {
        card.querySelector('.actions').remove();
        add('tool', approved ? 'approved create_ticket' : 'declined create_ticket');
        lock(true);
        try {
          const res = await fetch('/api/conversations/' + conversationId + '/confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ callId: evt.callId, approved })
          });
          await consume(res);
        } catch (e) { add('err', String(e)); }
        lock(false);
      };
      card.querySelector('.approve').onclick = () => decide(true);
      card.querySelector('.decline').onclick = () => decide(false);
      log.appendChild(card);
      log.scrollTop = log.scrollHeight;
    }

    function lock(busy) { send.disabled = busy; input.disabled = busy; if (!busy) input.focus(); }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      if (!conversationId) await newConversation();
      add('user', text);
      input.value = '';
      lock(true);
      try {
        const res = await fetch('/api/conversations/' + conversationId + '/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text })
        });
        await consume(res);
      } catch (e) { add('err', String(e)); }
      lock(false);
    });

    document.getElementById('reset').onclick = newConversation;
    newConversation();
  </script>
</body>
</html>
