<header class="app-header">
  <h1>TicketAssistant</h1>
  <span class="sub">tickets across all backends</span>
</header>

<app-toolbar [jiraEnabled]="jiraEnabled()" (userChanged)="onUserChanged($event)" />

@if (jiraEnabled() && !jira.status().connected) {
  <div class="connect-banner">Connect your Jira account (top right) to include your Jira tickets and projects.</div>
}

@if (conversation(); as conv) {
  <app-chat [conversation]="conv" [enabled]="chatEnabled()" />
} @else {
  <div class="loading">Starting…</div>
}
