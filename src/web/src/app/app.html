<header class="app-header">
  <div class="brand">
    <span class="mark">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M12 2c.5 4.6 2.6 6.7 8 8-5.4 1.3-7.5 3.4-8 8-.5-4.6-2.6-6.7-8-8 5.4-1.3 7.5-3.4 8-8z"/>
      </svg>
    </span>
    <div class="brand-text">
      <h1>Ticket<span class="accent">Assistant</span></h1>
      <span class="sub">one chat · every backend</span>
    </div>
  </div>

  <button class="new-chat" (click)="newChat()" title="Start a new conversation">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>
    </svg>
    New chat
  </button>

  <app-toolbar [jiraEnabled]="jiraEnabled()" (userChanged)="onUserChanged($event)" />
</header>

@if (jiraEnabled() && !jira.status().connected) {
  <div class="connect-banner">
    <span class="dot-pulse"></span>
    Connect Jira (top right) to fold in your Jira tickets and projects — chatting works without it.
  </div>
}

<main class="stage">
  <div class="conversation">
    @if (conversation(); as conv) {
      <app-chat [conversation]="conv" />
    } @else {
      <div class="loading">
        <span class="l-dot"></span><span class="l-dot"></span><span class="l-dot"></span>
      </div>
    }
  </div>

  <!-- Docked beside the chat rather than over it: the whole point is to watch the trace and the
       conversation at the same time. -->
  @if (debug.enabled()) {
    <app-debug-console (closed)="debug.setEnabled(false)" />
  }
</main>
